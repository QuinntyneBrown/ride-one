<div class="dialog__panel" [class.dialog__panel--sm]="size() === 'sm'">
  <div class="dialog__header">
    <div
      class="dialog__icon"
      [class.dialog__icon--danger]="tone() === 'danger'"
      [class.dialog__icon--info]="tone() === 'info'"
      aria-hidden="true"
    >
      <wz-icon [name]="icon()" />
    </div>
    <div class="dialog__heading">
      <h2 class="dialog__title" [id]="dialogId() + '-title'">{{ heading() }}</h2>
      <p class="dialog__desc" [id]="dialogId() + '-desc'">{{ description() }}</p>
    </div>
    <button
      class="btn btn--ghost btn--icon"
      type="button"
      aria-label="Close"
      [disabled]="busy()"
      (click)="close()"
    >
      <wz-icon name="close" />
    </button>
  </div>
  <div class="dialog__body"><ng-content /></div>
  <div class="dialog__footer"><ng-content select="[dialog-footer]" /></div>
</div>
