<wz-auth-card [centered]="true">
  <p class="numeral not-found__code" aria-hidden="true">404</p>
  <h1 class="not-found__title">This page isn't part of your ride</h1>
  <p class="text-muted">
    The address {{ path }} doesn't exist in Wattzup. Your ride and the bike connection are
    unaffected.
  </p>
  <div class="not-found__actions">
    <a class="btn btn--volt" routerLink="/">Back to the dashboard</a>
    <a class="btn" routerLink="/setup">Set up a ride</a>
  </div>
</wz-auth-card>
