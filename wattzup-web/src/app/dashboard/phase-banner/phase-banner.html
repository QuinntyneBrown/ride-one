@if (cues.banner(); as b) {
  @for (view of [b]; track view.id) {
    <div class="phase-banner" [class.phase-banner--rest]="view.rest" aria-hidden="true">
      <span class="phase-banner__headline">{{ view.headline }}</span>
      <small>{{ view.detail }}</small>
    </div>
  }
}
<div class="phase-announcer visually-hidden" role="status" aria-live="polite">
  {{ cues.announcement() }}
</div>
