<div class="level-control">
  <button
    class="step-btn"
    type="button"
    aria-label="Lower resistance"
    [disabled]="controls().lowerDisabled"
    (click)="step.emit(-1)"
  >
    <wz-icon name="minus" size="lg" />
  </button>
  <div class="level-readout">
    <span class="numeral" aria-live="polite">{{ view().valueText }}</span><small>of 32</small>
    @if (view().settingText; as setting) {
      <span class="level-readout__target" role="status">{{ setting }}</span>
    }
  </div>
  <button
    class="step-btn"
    type="button"
    aria-label="Raise resistance"
    [disabled]="controls().raiseDisabled"
    (click)="step.emit(1)"
  >
    <wz-icon name="plus" size="lg" />
  </button>
</div>
