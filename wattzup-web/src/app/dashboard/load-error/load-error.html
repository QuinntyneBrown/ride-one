<div class="empty empty--error" role="alert">
  <div class="empty__icon"><wz-icon name="alert-circle" size="lg" /></div>
  <h2 class="empty__title">Couldn't load your ride</h2>
  <p class="empty__text">
    The Wattzup server answered GET /api/status with an error ({{ code() }}). Your bike connection
    and any running workout are not affected.
  </p>
  <div class="empty__actions">
    <button class="btn btn--volt" type="button" (click)="retry.emit()">
      <wz-icon name="refresh" size="sm" />Try again
    </button>
    <button class="btn" type="button" (click)="diagnostics.emit()">Open diagnostics</button>
  </div>
</div>
