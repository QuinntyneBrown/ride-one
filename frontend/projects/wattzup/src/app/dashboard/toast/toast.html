@let t = toast();
<div
  class="toast"
  [class]="'toast--' + t.tone"
  [attr.role]="t.tone === 'danger' ? 'alert' : null"
  (pointerenter)="hold.emit(true)"
  (pointerleave)="hold.emit(false)"
  (focusin)="hold.emit(true)"
  (focusout)="hold.emit(false)"
>
  <span class="toast__icon"><wz-icon [name]="icon()" /></span>
  <div class="toast__body">
    <div class="toast__title">{{ t.title }}</div>
    <div class="toast__text">{{ t.text }}</div>
    @if (t.action; as a) {
      <button class="toast__action" type="button" (click)="a.run()">{{ a.label }}</button>
    }
  </div>
  <button class="close" type="button" aria-label="Dismiss" (click)="dismiss.emit()">
    <wz-icon name="close" size="sm" />
  </button>
</div>
