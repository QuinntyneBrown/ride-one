@let f = fields();
@let err = errors();
<wz-dialog dialogId="edit-stretch" [heading]="heading" [description]="description" icon="sliders">
  <div class="edit-stretch">
    <div class="edit-stretch__grid">
      <wz-number-stepper
        fieldId="stretch-duration"
        label="Duration"
        [value]="f.duration"
        [error]="err.duration ?? null"
        (valueChange)="edit({ duration: $event })"
        (step)="step('duration', $event)"
        (submitted)="save()"
      />
      <wz-number-stepper
        fieldId="stretch-cadence"
        label="Cadence aim"
        [value]="f.cadence"
        [error]="err.cadence ?? null"
        (valueChange)="edit({ cadence: $event })"
        (step)="step('cadence', $event)"
        (submitted)="save()"
      />
    </div>
    <wz-slider
      fieldId="stretch-level"
      label="Resistance"
      tone="rest"
      [level]="f.level"
      (levelChange)="edit({ level: $event })"
    />
  </div>
  <div dialog-footer class="edit-stretch__actions">
    <button class="btn" type="button" (click)="ref.close()">Cancel</button>
    <button class="btn btn--volt" type="button" [disabled]="!saved()" (click)="save()">Save</button>
  </div>
</wz-dialog>
