@let id = rowId();
<div
  class="effort-row"
  [class.effort-row--large]="large()"
  role="group"
  [attr.aria-labelledby]="id + '-title'"
>
  <div class="effort-row__title" [id]="id + '-title'">
    <span class="swatch" [class]="'swatch--' + tone()" aria-hidden="true"></span>{{ title() }}
  </div>
  <div class="effort-row__grid">
    <div>
      <div class="effort-row__head">
        <label [for]="id + '-speed'">Speed</label
        ><span class="effort-row__pace">{{ pace() }} /km</span>
      </div>
      <div class="effort-row__speed">
        <button
          class="btn btn--icon effort-row__btn"
          type="button"
          [attr.aria-label]="'Slower ' + title()"
          [disabled]="disabled() || !canSlower()"
          (click)="step.emit(-1)"
        >
          <wz-icon name="minus" size="sm" />
        </button>
        <span class="effort-row__value"
          ><input
            class="effort-row__input"
            type="text"
            inputmode="decimal"
            autocomplete="off"
            size="4"
            [id]="id + '-speed'"
            [value]="speed()"
            [readOnly]="disabled()"
            [attr.aria-invalid]="error() ? 'true' : null"
            [attr.aria-describedby]="error() ? id + '-speed-err' : null"
            (input)="speedChange.emit($any($event.target).value)"
            (keydown.enter)="$event.preventDefault(); submitted.emit()"
          /><small>km/h</small></span
        >
        <button
          class="btn btn--icon effort-row__btn"
          type="button"
          [attr.aria-label]="'Faster ' + title()"
          [disabled]="disabled() || !canFaster()"
          (click)="step.emit(1)"
        >
          <wz-icon name="plus" size="sm" />
        </button>
      </div>
      @if (error(); as message) {
        <p class="field__error" [id]="id + '-speed-err'">{{ message }}</p>
      }
    </div>
    <div>
      <div class="effort-row__head">
        <span [id]="id + '-incline-label'">Incline</span
        ><span class="effort-row__incline">{{ inclineText() }}</span>
      </div>
      <wz-level-picker
        [incline]="true"
        [fieldId]="id + '-incline'"
        [labelledBy]="id + '-incline-label'"
        [valueText]="inclineValueText()"
        [view]="inclineView()"
        [disabled]="disabled()"
        (pick)="inclineChange.emit($event)"
      />
      <div class="effort-row__scale" aria-hidden="true"><span>0%</span><span>10%</span></div>
    </div>
  </div>
</div>
