<div class="quick-speeds" role="group" aria-label="Jump to a speed">
  @for (s of speeds; track s) {
    <button
      class="chip chip--solid"
      type="button"
      [attr.aria-pressed]="s === pressed()"
      [disabled]="disabled()"
      (click)="pick.emit(s)"
    >
      {{ s }}
    </button>
  }
</div>
