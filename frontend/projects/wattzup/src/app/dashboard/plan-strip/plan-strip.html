@let s = strip();
<svg
  class="profile profile--strip"
  [attr.viewBox]="'0 0 ' + s.total + ' 32'"
  preserveAspectRatio="none"
  role="img"
  [attr.aria-label]="s.label"
>
  @for (bar of s.bars; track $index) {
    <rect [attr.class]="bar.tone" [attr.x]="bar.x" [attr.width]="bar.width" y="0" height="32" />
  }
  <rect
    class="is-playhead"
    [attr.x]="s.playhead.x"
    [attr.width]="s.playhead.width"
    y="0"
    height="32"
  />
</svg>
