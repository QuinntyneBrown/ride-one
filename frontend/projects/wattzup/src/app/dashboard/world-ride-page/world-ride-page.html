@if (phase() === 'not-found') {
  <wz-class-not-found />
} @else if (view(); as v) {
  <wz-world-ride
    [view]="v"
    [clock]="clock()"
    [countdown]="countdown()"
    [classHref]="classHref()"
    (pauseToggled)="togglePause()"
    (endRequested)="end()"
    (stepped)="step($event)"
    (navigate)="navigate($event)"
  />
}
