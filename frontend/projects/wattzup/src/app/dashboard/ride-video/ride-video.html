<div
  class="video-frame video-frame--fill"
  id="view-video"
  role="tabpanel"
  aria-labelledby="tab-video"
>
  <div #host class="video-frame__host"></div>
  @if (sync.blocked()) {
    <button class="video-frame__scrim" type="button" (click)="sync.playNow()">
      <span class="btn btn--primary btn--lg"
        ><wz-icon name="play" size="sm" />Play video in sync</span
      >
    </button>
  }
</div>
