<span class="class-card__cover"
  ><img class="photo" [src]="cover()" alt="" />
  @if (opensAtLevel(); as level) {
    <span class="class-card__lock"
      ><span class="class-card__lock-label"
        ><svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg
        >Opens at level {{ level }}</span
      ></span
    >
  }
  <span class="class-card__time">{{ time() }}</span></span
>
<wz-class-profile [segments]="segments()" />
<span class="class-card__title">{{ title() }}</span>
<span class="class-card__meta">{{ channel() }} · {{ focus() }}</span>
