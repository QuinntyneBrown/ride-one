<svg
  class="class-profile"
  [attr.viewBox]="'0 0 ' + length() + ' 32'"
  preserveAspectRatio="none"
  aria-hidden="true"
>
  @for (bar of bars(); track $index) {
    <rect
      [attr.class]="bar.element"
      [attr.x]="bar.x"
      [attr.width]="bar.width"
      [attr.y]="bar.y"
      [attr.height]="bar.height"
    />
  }
</svg>
