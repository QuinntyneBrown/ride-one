<div class="class-course">
  @if (loading() || unavailable()) {
    <img class="class-course__still" [src]="still().url" [alt]="still().alt" />
  }
  <div class="class-course__scene">
    <ng-content select="[slot=scene]" />
  </div>
  <!-- What lies over the course: the countdown (L2-180 AC1); the Music button stays above it. -->
  <ng-content select="[slot=overlay]" />
  @if (loading() && !unavailable()) {
    <p class="class-course__loading" role="status">Loading {{ name() }}</p>
  }
  <button
    wz-button
    variant="raised"
    size="sm"
    type="button"
    class="class-course__music"
    [attr.aria-pressed]="musicOn() && musicAvailable()"
    [disabled]="!musicAvailable()"
    (click)="musicToggle.emit()"
  >
    <svg class="class-course__music-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M9 18V5l12-2v13" />
      <circle cx="6" cy="18" r="3" />
      <circle cx="18" cy="16" r="3" />
      @if (!musicOn() || !musicAvailable()) {
        <path d="m2 2 20 20" />
      }
    </svg>
    <span>Music</span>
  </button>
  <!-- The ride's controls on the box's left edge: the intensity (L2-183 AC1), over the picture and "Paused". -->
  <div class="class-course__controls">
    <ng-content select="[slot=controls]" />
  </div>
  @if (paused()) {
    <div class="class-course__paused" aria-hidden="true">
      <p class="class-course__paused-label">Paused</p>
    </div>
  }
</div>
@if (unavailable()) {
  <wz-inline-message class="class-course__notice" tone="warn" role="status"
    >Ibiza can’t be drawn. The bike will still follow the class.</wz-inline-message
  >
}
