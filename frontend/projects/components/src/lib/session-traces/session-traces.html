<section
  class="session-traces"
  [class.session-traces--focusing]="focusDip() !== null"
  [attr.aria-label]="view().label"
>
  <div class="session-traces__legend">
    <span class="session-traces__label">Cadence</span>
    <ul class="session-traces__keys">
      <li class="session-traces__key"><span class="session-traces__swatch"></span>Actual</li>
      <li class="session-traces__key">
        <span class="session-traces__swatch session-traces__swatch--aim"></span>Target
      </li>
      <li class="session-traces__key">
        <span class="session-traces__swatch session-traces__swatch--dip"></span>Under target
      </li>
    </ul>
  </div>
  <div class="session-traces__chart">
    <svg
      [attr.viewBox]="'0 0 ' + view().total + ' 80'"
      preserveAspectRatio="none"
      aria-hidden="true"
    >
      @for (y of view().grid; track y) {
        <line
          class="session-traces__grid"
          x1="0"
          [attr.x2]="view().total"
          [attr.y1]="y"
          [attr.y2]="y"
        />
      }
      @for (band of view().bands; track $index) {
        <rect
          class="session-traces__dip"
          [class.session-traces__dip--focus]="focusDip() === $index"
          [attr.x]="band.x"
          [attr.width]="band.width"
          y="0"
          height="80"
        />
      }
      @for (aim of view().aims; track $index) {
        <line
          class="session-traces__aim"
          [attr.x1]="aim.x1"
          [attr.x2]="aim.x2"
          [attr.y1]="aim.y"
          [attr.y2]="aim.y"
        />
      }
      <polyline class="session-traces__cadence" [attr.points]="view().cadence" />
    </svg>
    @for (label of view().yLabels; track label.text) {
      <span class="session-traces__ylabel" [style.top.%]="label.at">{{ label.text }}</span>
    }
  </div>
  <div class="session-traces__power-head">
    <span class="session-traces__label">Power</span><span>{{ view().powerMax }} W</span>
  </div>
  <div class="session-traces__chart session-traces__chart--power">
    <svg
      [attr.viewBox]="'0 0 ' + view().total + ' ' + view().powerMax"
      preserveAspectRatio="none"
      aria-hidden="true"
    >
      @for (span of view().work; track $index) {
        <rect
          class="session-traces__work"
          [attr.x]="span.x"
          [attr.width]="span.width"
          y="0"
          [attr.height]="view().powerMax"
        />
      }
      <polyline class="session-traces__power" [attr.points]="view().power" />
    </svg>
  </div>
  <div class="session-traces__axis" aria-hidden="true">
    @for (tick of view().ticks; track tick.text) {
      <span class="session-traces__tick" [style.left.%]="tick.at">{{ tick.text }}</span>
    }
  </div>
</section>
