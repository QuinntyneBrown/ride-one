<ol
  class="set-list"
  aria-label="Plan"
  [attr.aria-invalid]="error() ? 'true' : null"
  [attr.aria-describedby]="error() ? 'sets-error' : null"
>
  <ng-container *ngTemplateOutlet="stretch; context: { $implicit: view().warmup }"></ng-container>
  @for (row of view().sets; track $index; let i = $index, first = $first, last = $last) {
    <li class="set-row">
      <span class="set-row__head"
        ><b>Set {{ i + 1 }}</b></span
      >
      <span class="set-row__value"
        ><span class="set-row__work">{{ row.work }}</span
        ><span class="set-row__rest">{{ row.rest }}</span></span
      >
      <span class="set-row__actions">
        <button
          class="btn btn--sm"
          type="button"
          [attr.data-focus]="'edit-' + i"
          [disabled]="disabled()"
          (click)="editSet.emit(i)"
        >
          <wz-icon name="edit" size="sm" />Edit<span class="visually-hidden"> set {{ i + 1 }}</span>
        </button>
        <button
          class="btn btn--ghost btn--icon btn--sm"
          type="button"
          [attr.aria-label]="'Move set ' + (i + 1) + ' up'"
          [attr.data-focus]="'up-' + i"
          [disabled]="disabled() || first"
          (click)="moveSet(i, -1)"
        >
          <wz-icon name="chevron-up" size="sm" />
        </button>
        <button
          class="btn btn--ghost btn--icon btn--sm"
          type="button"
          [attr.aria-label]="'Move set ' + (i + 1) + ' down'"
          [attr.data-focus]="'down-' + i"
          [disabled]="disabled() || last"
          (click)="moveSet(i, 1)"
        >
          <wz-icon name="chevron-down" size="sm" />
        </button>
        <button
          class="btn btn--ghost btn--icon btn--sm"
          type="button"
          [attr.aria-label]="'Remove set ' + (i + 1)"
          [attr.data-focus]="'remove-' + i"
          [disabled]="disabled() || (first && last)"
          (click)="removeSet(i)"
        >
          <wz-icon name="trash" size="sm" />
        </button>
      </span>
    </li>
  }
  <ng-container *ngTemplateOutlet="stretch; context: { $implicit: view().cooldown }"></ng-container>
</ol>
<button
  class="btn set-list__add"
  type="button"
  id="add-set"
  data-focus="add"
  [disabled]="disabled() || view().full"
  (click)="add.emit()"
>
  <wz-icon name="plus" size="sm" />Add set
</button>
@if (error(); as message) {
  <p class="field__error" id="sets-error">{{ message }}</p>
}

<ng-template #stretch let-row>
  <li class="set-row set-row--stretch">
    <span class="set-row__head"
      ><label class="set-row__switch"
        ><span class="switch"
          ><input
            type="checkbox"
            role="switch"
            [attr.aria-label]="row.name"
            [checked]="row.on"
            [disabled]="disabled()"
            (change)="
              switchStretch.emit({ kind: row.kind, on: $any($event.target).checked })
            " /></span
        ><b>{{ row.name }}</b></label
      ></span
    >
    <span class="set-row__value">{{ row.line }}</span>
    <span class="set-row__actions">
      <button
        class="btn btn--sm"
        type="button"
        [disabled]="disabled()"
        (click)="editStretch.emit(row.kind)"
      >
        <wz-icon name="edit" size="sm" />Edit<span class="visually-hidden">
          {{ row.name.toLowerCase() }}</span
        >
      </button>
    </span>
  </li>
</ng-template>
