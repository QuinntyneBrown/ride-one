<section class="achievement-list" aria-labelledby="badges">
  <div class="achievement-list__head">
    <h2 class="achievement-list__title" id="badges">Achievements</h2>
    <span class="achievement-list__count">{{ unlocked() }} of {{ achievements().length }}</span>
  </div>
  <ul class="achievement-list__items">
    @for (a of achievements(); track a.id) {
      <li class="achievement" [class.achievement--unlocked]="a.unlocked">
        @if (a.unlocked) {
          <span class="achievement__badge" role="img" aria-label="Unlocked"
            ><wz-icon name="check-circle" size="sm"
          /></span>
        } @else {
          <span class="achievement__badge" role="img" aria-label="Locked">{{ a.percent }}%</span>
        }
        <div class="achievement__body">
          <div class="achievement__top">
            <span class="achievement__title">{{ a.title }}</span>
            @if (!a.unlocked) {
              <span class="achievement__value">{{ a.progress }}</span>
            }
          </div>
          <p class="achievement__detail">{{ a.detail }}</p>
          @if (!a.unlocked) {
            <div
              class="achievement__bar"
              role="progressbar"
              [attr.aria-label]="a.title"
              aria-valuemin="0"
              [attr.aria-valuemax]="a.goal"
              [attr.aria-valuenow]="a.value"
            >
              <div class="achievement__fill" [style.width.%]="a.percent"></div>
            </div>
          }
        </div>
      </li>
    }
  </ul>
</section>
