<div class="incline-control" role="group" [attr.aria-labelledby]="labelledBy()">
  <button
    class="step-btn"
    type="button"
    aria-label="Lower incline"
    [disabled]="lowerDisabled()"
    (click)="step.emit(-1)"
  >
    <wz-icon name="minus" size="lg" />
  </button>
  <div class="incline-control__readout">
    <span class="numeral" aria-live="polite">{{ valueText() }}<small>%</small></span
    ><small>of 10%</small>
  </div>
  <button
    class="step-btn"
    type="button"
    aria-label="Raise incline"
    [disabled]="raiseDisabled()"
    (click)="step.emit(1)"
  >
    <wz-icon name="plus" size="lg" />
  </button>
</div>
