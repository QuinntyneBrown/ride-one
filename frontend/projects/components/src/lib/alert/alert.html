<div
  class="alert"
  [class.banner]="banner()"
  [class.alert--success]="tone() === 'success'"
  [class.alert--warning]="tone() === 'warning'"
  [class.alert--danger]="tone() === 'danger'"
  [attr.role]="tone() === 'warning' || tone() === 'danger' ? 'alert' : 'status'"
>
  <span class="alert__icon"><wz-icon [name]="icon()" /></span>
  <div class="alert__body">
    <span class="alert__title">{{ heading() }}</span>
    @if (text(); as t) {
      <span class="alert__text">{{ t }}</span>
    }
    <ng-content />
    @if (actionLabel(); as label) {
      <div class="alert__actions">
        @if (actionHref(); as href) {
          <a [href]="href">{{ label }}</a>
        } @else {
          <button type="button" (click)="action.emit()">{{ label }}</button>
        }
      </div>
    }
  </div>
  @if (dismissable()) {
    <button class="close" type="button" aria-label="Dismiss" (click)="dismiss.emit()">
      <wz-icon name="close" size="sm" />
    </button>
  }
</div>
