<ol class="week-strip">
  @for (day of days(); track day.label) {
    <li
      class="week-strip__day"
      [class.week-strip__day--ridden]="day.ridden"
      [class.week-strip__day--today]="day.today"
      [class.week-strip__day--future]="day.future"
    >
      <span class="week-strip__bar" role="img" [attr.aria-label]="day.label"></span>
      <span class="week-strip__label" aria-hidden="true">{{ day.letter }}</span>
    </li>
  }
</ol>
