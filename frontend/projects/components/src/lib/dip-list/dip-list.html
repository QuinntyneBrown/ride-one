<section class="dip-list" aria-labelledby="dips">
  <div class="dip-list__head">
    <h2 class="dip-list__title" id="dips">Cadence dips</h2>
    <span class="dip-list__on-target">{{ view().onTarget }}</span>
  </div>
  @if (view().rows.length === 0) {
    <p class="dip-list__empty">Cadence held at target for the whole ride. Nothing to fix.</p>
  } @else {
    <p class="dip-list__lead">{{ view().lead }}</p>
    <ul class="dip-list__items">
      @for (row of view().rows; track $index) {
        <li>
          <button
            class="dip-list__row"
            type="button"
            (mouseenter)="focusDip.emit($index)"
            (mouseleave)="focusDip.emit(null)"
            (focus)="focusDip.emit($index)"
            (blur)="focusDip.emit(null)"
          >
            <span class="dip-list__time">{{ row.time }}</span>
            <span class="dip-list__what"
              >{{ row.what }}<span class="dip-list__detail">{{ row.detail }}</span></span
            >
            <span class="dip-list__drop" [attr.aria-label]="row.dropLabel">{{ row.drop }}</span>
          </button>
        </li>
      }
    </ul>
  }
</section>
