<div
  class="level-slider"
  [class.level-slider--rest]="tone() === 'rest'"
  [class.level-slider--large]="large()"
>
  <div class="level-slider__head">
    <label [for]="fieldId()">{{ label() }}</label>
    <output class="numeral" [for]="fieldId()">{{ level() }}<small> / 32</small></output>
  </div>
  <input
    type="range"
    min="1"
    max="32"
    step="1"
    [id]="fieldId()"
    [value]="level()"
    [disabled]="disabled()"
    (input)="onInput($event)"
  />
  <div class="level-slider__scale" aria-hidden="true"><span>Light</span><span>Max</span></div>
</div>
