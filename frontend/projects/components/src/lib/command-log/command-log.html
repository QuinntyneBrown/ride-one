<section class="cmd-log" aria-labelledby="cmd-title">
  <div class="cmd-log__head">
    <h3 id="cmd-title">{{ title() }}</h3>
    @if (connectionId(); as id) {
      <code>BLE · {{ id }}</code>
    }
  </div>
  <ol>
    @for (e of entries(); track e.key) {
      <li>
        <time>{{ e.time }}</time><span class="cmd"
          >{{ e.label }} <span>· {{ e.source }}</span></span
        ><span [class]="e.status">{{ e.text }}</span>
      </li>
    } @empty {
      <li>
        <span class="cmd"><span>No commands yet this session.</span></span>
      </li>
    }
  </ol>
</section>
