<section class="device-history" aria-labelledby="device-history-title">
  <h2 class="device-history__title" id="device-history-title">Your history</h2>
  <p class="device-history__text">{{ view().text }}</p>
  <p class="device-history__age" [class.device-history__age--stale]="view().stale">
    @if (view().stale) {
      <wz-icon name="warning" size="sm" /><span class="visually-hidden">Warning: </span>
    }
    <span class="device-history__age-text">{{ view().age }}</span>
  </p>
  <div class="device-history__actions">
    <button class="btn" type="button" (click)="exportHistory.emit()">
      <wz-icon name="download" size="sm" />Export history
    </button>
    <wz-history-import describedBy="device-history-hint" (pick)="importFile.emit($event)" />
  </div>
  <p class="device-history__hint" id="device-history-hint">
    Imports merge with what’s here — rides you already have are skipped.
  </p>
</section>
