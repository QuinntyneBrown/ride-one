<button
  class="btn btn--quiet"
  type="button"
  [attr.aria-describedby]="describedBy()"
  (click)="open()"
>
  <wz-icon name="upload" size="sm" />Import history
</button>
<input
  #file
  class="visually-hidden"
  type="file"
  accept="application/json,.json"
  tabindex="-1"
  aria-hidden="true"
  (change)="chosen()"
/>
