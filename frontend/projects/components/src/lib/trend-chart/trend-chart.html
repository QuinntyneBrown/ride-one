<section class="trend-chart" [attr.aria-label]="view().label">
  <div class="trend-chart__figure">
    <div class="trend-chart__value">
      {{ view().value }}<span class="trend-chart__unit">{{ view().unit }}</span>
    </div>
    <p class="trend-chart__change">
      <span
        class="trend-chart__delta"
        [class.trend-chart__delta--better]="view().tone === 'better'"
        [class.trend-chart__delta--worse]="view().tone === 'worse'"
        >{{ view().change }}</span>{{ view().since }}
    </p>
  </div>
  <div class="trend-chart__plot">
    @for (line of view().gridlines; track $index) {
      <div class="trend-chart__gridline" [style.top.%]="line.at">
        <span class="trend-chart__ylabel">{{ line.text }}</span>
      </div>
    }
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <polyline class="trend-chart__line" [attr.points]="view().line" />
    </svg>
    @for (point of view().points; track point.id) {
      <a
        class="trend-chart__point"
        [class.trend-chart__point--latest]="point.latest"
        [href]="'/sessions/' + point.id"
        (click)="onClick($event, point.id)"
        [style.left.%]="point.x"
        [style.top.%]="point.y"
        [attr.aria-label]="point.label"
        ><span class="trend-chart__dot"></span
      ></a>
    }
  </div>
  <div class="trend-chart__axis" aria-hidden="true">
    @for (label of view().xLabels; track $index) {
      <span class="trend-chart__xlabel" [style.left.%]="label.at">{{ label.text }}</span>
    }
  </div>
</section>
