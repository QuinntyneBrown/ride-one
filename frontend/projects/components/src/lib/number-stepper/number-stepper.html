<div class="num-stepper" [attr.data-invalid]="error() ? '' : null">
  <label class="num-stepper__label" [for]="fieldId()">{{ label() }}</label>
  <div class="num-stepper__row">
    <button
      class="btn btn--icon num-stepper__btn"
      type="button"
      [attr.aria-label]="lessLabel() ?? 'Less ' + (stepName() ?? label().toLowerCase())"
      [disabled]="readonly()"
      (click)="step.emit(-1)"
    >
      <wz-icon name="minus" size="sm" />
    </button>
    <input
      class="numeral num-stepper__input"
      type="text"
      [attr.inputmode]="inputMode()"
      autocomplete="off"
      size="5"
      [id]="fieldId()"
      [value]="value()"
      [readOnly]="readonly()"
      [attr.aria-invalid]="error() ? 'true' : null"
      [attr.aria-describedby]="description()"
      (input)="valueChange.emit($any($event.target).value)"
      (keydown.enter)="$event.preventDefault(); submitted.emit()"
      (blur)="blurred.emit()"
    />
    <button
      class="btn btn--icon num-stepper__btn"
      type="button"
      [attr.aria-label]="moreLabel() ?? 'More ' + (stepName() ?? label().toLowerCase())"
      [disabled]="readonly()"
      (click)="step.emit(1)"
    >
      <wz-icon name="plus" size="sm" />
    </button>
  </div>
  @if (error(); as message) {
    <p class="field__error" [id]="fieldId() + '-err'">{{ message }}</p>
  }
</div>
