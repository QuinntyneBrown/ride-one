<section class="session-list" aria-labelledby="sessions">
  <div class="session-list__head">
    <h2 class="session-list__title" id="sessions">Sessions</h2>
    <span class="session-list__count">{{ total() }} saved</span>
  </div>
  <div class="session-list__cols" aria-hidden="true">
    <span class="session-list__wide">Date</span><span>Ride</span
    ><span class="session-list__num session-list__wide">Time</span
    ><span class="session-list__num">Avg</span><span class="session-list__num">On target</span
    ><span class="session-list__num session-list__wide">Dips</span
    ><span class="session-list__wide"></span>
  </div>
  <ul class="session-list__items">
    @for (row of rows(); track row.id) {
      <li>
        <a
          class="session-list__row"
          [href]="'/sessions/' + row.id"
          (click)="onClick($event, row.id)"
        >
          <span class="session-list__date session-list__wide">{{ row.date }}</span>
          <span class="session-list__ride">
            <span class="session-list__name">{{ row.title }}</span>
            <span class="session-list__sub">{{ row.date }} · {{ row.time }}</span>
            @if (row.early) {
              <span class="session-list__early">Ended early</span>
            }
          </span>
          <span class="session-list__num session-list__wide">{{ row.time }}</span>
          <span class="session-list__num">{{ row.avgPower }}<small>W</small></span>
          <span class="session-list__num">{{ row.onTarget }}</span>
          <span
            class="session-list__num session-list__wide"
            [class.session-list__dips--some]="row.dips > 0"
            >{{ row.dips }}</span
          >
          <wz-icon
            class="session-list__chevron session-list__wide"
            name="chevron-right"
            size="sm"
          />
        </a>
      </li>
    }
  </ul>
  @if (foldable()) {
    <button class="btn btn--quiet btn--sm session-list__more" type="button" (click)="toggleAll.emit()">
      {{ expanded() ? 'Show fewer' : 'Show all ' + total() }}
    </button>
  }
</section>
