<dl class="stat-strip">
  @for (stat of stats(); track stat.label) {
    <div>
      <dt class="stat-strip__label">{{ stat.label }}</dt>
      <dd class="stat-strip__value">
        {{ stat.value }}
        @if (stat.unit) {
          <span class="stat-strip__unit">{{ stat.unit }}</span>
        }
      </dd>
    </div>
  }
</dl>
