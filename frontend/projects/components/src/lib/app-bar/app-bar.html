<header class="app-bar">
  <a class="lockup" [routerLink]="homeLink()" aria-label="Wattzup dashboard">
    <svg class="lockup__mark" viewBox="0 0 48 48" aria-hidden="true">
      <rect width="48" height="48" rx="12" />
      <path d="M8.5 16 L15.5 34 L23 21 L30.5 34 L39.5 10" />
    </svg>
    <span class="lockup__word">wattzup</span>
  </a>
  <span class="app-bar__divider" aria-hidden="true"></span>
  @if (loading()) {
    <span class="skeleton skeleton--status" aria-hidden="true"></span>
  } @else {
    <wz-status-line [status]="status()" [reducedMotion]="reducedMotion()" />
  }
  @if (workout(); as w) {
    <a
      class="btn btn--quiet btn--sm app-bar__workout"
      [routerLink]="setupLink()"
      [attr.aria-label]="'Edit workout: ' + w.summary"
      ><wz-icon name="sliders" size="sm" />{{ w.summary }}</a
    >
  } @else {
    <a class="btn btn--quiet btn--sm app-bar__workout" [routerLink]="setupLink()"
      ><wz-icon name="sliders" size="sm" />Set up a ride</a
    >
  }
  <div class="app-bar__end">
    @if (badge(); as b) {
      <span
        class="badge"
        [class.badge--info]="b.tone === 'info'"
        [class.badge--warning]="b.tone === 'warning'"
        [class.badge--danger]="b.tone === 'danger'"
        >{{ b.text }}</span
      >
    }
    @if (loading()) {
      <span class="skeleton skeleton--clock" aria-hidden="true"></span>
    } @else {
      <wz-ride-clock [elapsed]="elapsed()" [totalSeconds]="workout()?.total_seconds ?? null" />
    }
    @if (paused()) {
      <button class="btn" type="button" [disabled]="!pauseEnabled()" (click)="resumeRide.emit()">
        <wz-icon name="play" size="sm" /><span class="btn__label">Resume</span>
      </button>
    } @else {
      <button class="btn" type="button" [disabled]="!pauseEnabled()" (click)="pauseRide.emit()">
        <wz-icon name="pause" size="sm" /><span class="btn__label">Pause</span>
      </button>
    }
    @if (machine() === 'treadmill') {
      <button
        class="btn btn--stop-belt btn--collapsible"
        type="button"
        [disabled]="!endEnabled()"
        (click)="endRide.emit()"
      >
        <wz-icon name="stop" size="sm" /><span class="btn__label">Stop belt</span>
      </button>
    } @else {
      <button
        class="btn btn--quiet btn--end"
        type="button"
        [disabled]="!endEnabled()"
        (click)="endRide.emit()"
      >
        <wz-icon name="stop" size="sm" /><span class="btn__label">End</span>
      </button>
    }
    <button
      class="btn btn--quiet btn--icon"
      type="button"
      [attr.aria-pressed]="beeps()"
      [attr.aria-label]="beeps() ? 'Countdown beeps on' : 'Countdown beeps off'"
      (click)="toggleBeeps.emit()"
    >
      <wz-icon [name]="beeps() ? 'bell' : 'bell-off'" />
    </button>
    <button
      class="btn btn--quiet btn--icon"
      type="button"
      aria-label="Light theme"
      [attr.aria-pressed]="theme() === 'light'"
      (click)="toggleTheme.emit()"
    >
      <wz-icon [name]="theme() === 'light' ? 'moon' : 'sun'" />
    </button>
    <button
      class="btn btn--quiet btn--icon"
      type="button"
      aria-label="Diagnostics"
      (click)="diagnostics.emit()"
    >
      <wz-icon name="activity" />
    </button>
  </div>
</header>
