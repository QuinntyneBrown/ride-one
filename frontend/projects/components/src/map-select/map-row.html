<span class="map-row__thumb"><img class="photo" [src]="thumbnail()" alt="" /></span>
<span class="map-row__text">
  <span class="map-row__name"><ng-content /></span>
  <span class="map-row__facts">{{ facts() }}</span>
  @if (status() === 'open') {
    <span class="map-row__meta">
      <wz-stars [earned]="stars()" size="md" />
      @if (best(); as best) {
        <span class="map-row__best"
          >Best <span class="map-row__best-time">{{ best }}</span></span
        >
      }
    </span>
  }
</span>
@if (status() === 'open') {
  <svg class="icon icon--lg map-row__chevron" viewBox="0 0 24 24" aria-hidden="true">
    <path d="m9 18 6-6-6-6" />
  </svg>
}
