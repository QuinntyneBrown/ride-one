<main id="main" class="container page maps-layout" tabindex="-1">
  <section aria-labelledby="maps-title">
    <h1 class="page__title" id="maps-title">Maps</h1>
    <p class="maps__lead">
      Each map opens the next. Race well on the ones you have to unlock the rest.
    </p>
    <wz-map-path>
      @for (row of store.rows(); track row.map.id; let last = $last) {
        <li wz-map-path-item [state]="row.state" [last]="last">
          @if (row.state === 'open') {
            <a wz-map-row [state]="row.state">{{ row.map.name }}</a>
          } @else {
            <button wz-map-row type="button" disabled [state]="row.state">
              {{ row.map.name }}
            </button>
          }
        </li>
      }
    </wz-map-path>
  </section>
</main>
