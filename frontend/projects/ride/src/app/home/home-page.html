<main id="main" class="container page" tabindex="-1">
  <h1 class="page__title">{{ home.greeting() }}</h1>

  @if (home.nextRide(); as ride) {
    <wz-next-ride-card [view]="ride">
      <a
        wz-button
        slot="action"
        variant="primary"
        size="xl"
        [block]="true"
        [routerLink]="['/race', ride.mapId]"
        >Race {{ ride.name
        }}<svg class="icon icon--lg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h14" />
          <path d="m12 5 7 7-7 7" /></svg
      ></a>
    </wz-next-ride-card>
  }
</main>
