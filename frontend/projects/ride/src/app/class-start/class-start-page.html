<div class="class-start-page">
  <wz-class-start-header>
    <wz-app-header-bike slot="end" [status]="store.bike()" />
    <wz-fullscreen-button slot="end" />
  </wz-class-start-header>
  <div class="class-start-page__scroll">
    @if (store.dto(); as dto) {
      <main id="main" class="container class-start" tabindex="-1">
        <section class="class-start__main" aria-labelledby="class-title">
          <wz-class-start-video
            [videoId]="dto.video.videoId"
            [title]="dto.title"
            (frame)="store.parkVideo($event)"
          />
          <p class="class-start__meta">{{ store.meta() }}</p>
          <h1 class="class-start__title" id="class-title">{{ dto.title }}</h1>
          <p class="class-start__summary">{{ dto.summary }}</p>
          <wz-class-plan
            [lengthSeconds]="dto.lengthSeconds"
            [segments]="dto.plan.segments"
            [summary]="store.planSummary()"
          />
          <wz-class-sync
            [videoId]="dto.video.videoId"
            [syncOffsetSeconds]="dto.video.syncOffsetSeconds"
          />
        </section>
        <div class="class-start__go">
          <button
            wz-button
            variant="primary"
            size="xl"
            [block]="true"
            type="button"
            (click)="start(dto.id)"
          >
            Start class
          </button>
        </div>
      </main>
    } @else if (store.unavailable()) {
      <main id="main" class="container class-start__unavailable" tabindex="-1">
        <h1 class="visually-hidden">The class</h1>
        <wz-inline-message tone="warn" role="alert"
          >The class can’t be loaded. Check your connection and try again.</wz-inline-message
        >
        <button wz-button variant="raised" type="button" (click)="store.retry()">Try again</button>
      </main>
    }
  </div>
</div>
