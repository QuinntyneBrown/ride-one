<main id="main" class="container page profile" tabindex="-1">
  <div class="profile__main">
    <h1 class="page__title">Profile</h1>
  </div>
  <aside class="settings" aria-labelledby="settings">
    <h2 class="settings__title" id="settings">Settings</h2>
    <ul class="settings__list">
      <li>
        <!-- A paired bike's row opens Diagnostics; with none, it goes to Connect Bike to pair one (L2-113 AC1). -->
        @if (bike().paired) {
          <button
            wz-setting-row
            type="button"
            aria-haspopup="dialog"
            icon="bike"
            [title]="bike().title"
            [body]="bike().body"
            (click)="openDiagnostics()"
          ></button>
        } @else {
          <a
            wz-setting-row
            routerLink="/connect"
            icon="bike"
            [title]="bike().title"
            [body]="bike().body"
          ></a>
        }
      </li>
      <li>
        <a
          wz-setting-row
          routerLink="/settings"
          icon="settings"
          title="Ride settings"
          body="Quality, sound and display"
        ></a>
      </li>
    </ul>
  </aside>
</main>
