<main id="main" class="container page profile" tabindex="-1">
  <div class="profile__main">
    <section class="profile-level">
      <span class="profile-level__badge" aria-hidden="true">{{ level }}</span>
      <div class="profile-level__body">
        <h1 class="page__title">
          @if (name(); as name) {
            {{ name }} · Level {{ level }}
          } @else {
            Level {{ level }}
          }
        </h1>
      </div>
    </section>
  </div>
  <aside class="settings" aria-labelledby="settings">
    <h2 class="settings__title" id="settings">Settings</h2>
    <ul class="settings__list">
      <li>
        <button
          wz-setting-row
          type="button"
          icon="person"
          title="Display name"
          [body]="name() ?? ''"
          aria-haspopup="dialog"
          (click)="changeName()"
        ></button>
      </li>
      <li>
        <button
          wz-setting-row
          type="button"
          icon="sign-out"
          title="Sign out"
          body="On this device"
          [disabled]="account.signingOut()"
          (click)="account.signOut()"
        ></button>
      </li>
      <li>
        <button
          wz-setting-row
          type="button"
          icon="trash"
          title="Delete my account"
          body="Email, name, progress and rides"
          [danger]="true"
          aria-haspopup="dialog"
          (click)="deleteAccount()"
        ></button>
      </li>
    </ul>
    @if (account.signOutFailed()) {
      <wz-inline-message class="settings__message" tone="error" role="alert"
        >We couldn’t sign you out. Check your connection and try again.</wz-inline-message
      >
    }
  </aside>
</main>
