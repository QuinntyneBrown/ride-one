<main id="main" class="race" tabindex="-1">
  @if (store.map(); as map) {
    <h1 class="visually-hidden">Race, {{ map.name }}</h1>
    <!-- The map's photo stands for its world until the world is drawn (journey 8), as the mock draws it. -->
    <div class="race-scene" role="img" [attr.aria-label]="store.sceneLabel()">
      <img class="race-scene__photo" [src]="map.photoUrl" alt="" />
    </div>
    <wz-race-bar
      [map]="map.name"
      [route]="store.routeLine()"
      [bikeName]="store.bikeName()"
      [connected]="store.connected()"
      [elapsed]="store.elapsed()"
      [total]="store.total()"
      [solo]="store.mode === 'solo'"
    >
      <!-- Leave and End ask for no confirmation (L2-069 AC1, AC2); leaving the page stops the race. -->
      <a
        wz-race-bar-button
        quiet
        slot="end"
        [label]="store.mode === 'solo' ? 'End' : 'Leave'"
        [attr.aria-label]="store.mode === 'solo' ? 'End ride' : 'Leave race'"
        [routerLink]="store.setup"
      >
        <svg class="icon icon--md" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m16 17 5-5-5-5" />
          <path d="M21 12H9" />
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        </svg>
      </a>
    </wz-race-bar>
    <wz-race-power
      [place]="store.place()"
      [field]="store.fieldSize()"
      [gaps]="store.gaps()"
      [watts]="store.watts()"
      [target]="store.target()"
      [delta]="store.delta()"
      [cadence]="store.cadence()"
      [heart]="store.heart()"
      [speed]="store.speed()"
    />
    @if (store.boardRows().length > 0) {
      <wz-race-board [heading]="store.boardHeading()" [rows]="store.boardRows()" />
    }
    <section class="race-hud" aria-label="Interval, route and resistance">
      @if (store.plan(); as plan) {
        <wz-race-interval
          [segments]="map.plan.segments"
          [index]="plan.index"
          [remaining]="plan.remainingMs / 1000"
          [progress]="plan.progress"
        />
      }
      @if (store.routeView(); as route) {
        <wz-race-route [view]="route" [distance]="store.distance()" />
      }
      <wz-race-resist
        [level]="store.resistance()"
        [disabled]="!store.canControl()"
        (lower)="store.lower()"
        (raise)="store.raise()"
      />
    </section>
  }
</main>
