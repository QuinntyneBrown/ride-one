<div class="toggles toggles--video">
  <label class="toggle-row"
    ><span class="toggle-row__label"
      ><b>Ride along to a video</b><small>Plays in sync on the dashboard</small></span
    ><span class="switch"
      ><input
        type="checkbox"
        role="switch"
        [checked]="draft().on"
        [disabled]="disabled()"
        (change)="setOn($any($event.target).checked)" /></span
  ></label>
</div>
@if (draft().on) {
  @let err = error();
  <div class="video-sync">
    <div class="field">
      <label class="field__label" for="video-url">YouTube link</label>
      <input
        class="input"
        id="video-url"
        type="url"
        inputmode="url"
        autocomplete="off"
        [value]="draft().url"
        [readOnly]="disabled()"
        [attr.aria-invalid]="err ? 'true' : null"
        [attr.aria-describedby]="err ? 'video-url-error' : null"
        (input)="setUrl($any($event.target).value)"
      />
      @if (err) {
        <p class="field__error" id="video-url-error">{{ err }}</p>
      }
    </div>
    @if (videoId()) {
      <div class="video-frame"><div #host class="video-frame__host"></div></div>
      <div class="video-sync__row">
        <wz-num-stepper
          fieldId="video-offset"
          label="Ride 0:00 starts at"
          lessLabel="Half a second earlier"
          moreLabel="Half a second later"
          describedBy="video-help"
          inputMode="decimal"
          [value]="startText()"
          [readonly]="disabled()"
          (valueChange)="startText.set($event)"
          (submitted)="commitStart()"
          (blurred)="commitStart()"
          (step)="step($event)"
        />
        <div class="video-sync__actions">
          <button
            class="btn btn--subtle"
            type="button"
            [disabled]="disabled()"
            (click)="useCurrentTime()"
          >
            <wz-icon name="target" size="sm" />Use video's current time
          </button>
          <button class="btn btn--subtle" type="button" [disabled]="disabled()" (click)="check()">
            <wz-icon name="play" size="sm" />Check
          </button>
        </div>
      </div>
      <p class="field__help" id="video-help">
        Scrub the preview past the intro to the moment the warm-up begins, then use that time. The
        video skips to it when you start, and pauses and resumes with the ride.
      </p>
    }
  </div>
}
