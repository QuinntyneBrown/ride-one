<fieldset class="mode-cards">
  <legend class="visually-hidden">Training mode</legend>
  <label class="mode-card">
    <span class="mode-card__title"
      ><input
        type="radio"
        name="mode"
        value="hiit"
        [checked]="mode() === 'hiit'"
        [disabled]="disabled()"
        (change)="mode.set('hiit')"
      />HIIT intervals</span
    >
    <p>
      @if (machine() === 'treadmill') {
        Hard and easy efforts on repeat. Speed and incline switch at every interval.
      } @else {
        Hard and easy efforts on repeat. Resistance switches at every interval.
      }
    </p>
  </label>
  @if (machine() === 'bike') {
    <label class="mode-card">
      <span class="mode-card__title"
        ><input
          type="radio"
          name="mode"
          value="intervals"
          [checked]="mode() === 'intervals'"
          [disabled]="disabled()"
          (change)="mode.set('intervals')"
        />Intervals</span
      >
      <p>
        Build your own sets: every set, the warm-up and the cool-down has its own times, levels and
        cadence aim.
      </p>
    </label>
  }
  <label class="mode-card">
    <span class="mode-card__title"
      ><input
        type="radio"
        name="mode"
        value="flat"
        [checked]="mode() === 'flat'"
        [disabled]="disabled()"
        (change)="mode.set('flat')"
      />{{ machine() === 'treadmill' ? 'Steady' : 'Flat resistance' }}</span
    >
    <p>
      @if (machine() === 'treadmill') {
        One speed and one incline, held the whole run. Good for hill walks and easy miles.
      } @else {
        One level, held the whole ride. You set the pace with your legs.
      }
    </p>
  </label>
</fieldset>
