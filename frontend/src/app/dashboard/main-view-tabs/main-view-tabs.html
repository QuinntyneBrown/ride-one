<div class="main-view-tabs">
  <div class="view-switch" role="tablist" aria-label="Main view">
    <button
      #tab
      class="view-switch__tab"
      type="button"
      role="tab"
      id="tab-video"
      aria-controls="view-video"
      [attr.aria-selected]="view() === 'video'"
      [attr.tabindex]="view() === 'video' ? 0 : -1"
      (click)="view.set('video')"
      (keydown)="onKey($event)"
    >
      Video
    </button>
    <button
      #tab
      class="view-switch__tab"
      type="button"
      role="tab"
      id="tab-chart"
      aria-controls="view-chart"
      [attr.aria-selected]="view() === 'chart'"
      [attr.tabindex]="view() === 'chart' ? 0 : -1"
      (click)="view.set('chart')"
      (keydown)="onKey($event)"
    >
      Power vs. plan
    </button>
  </div>
  <span class="main-view-tabs__caption">In sync · pauses with the ride</span>
</div>
