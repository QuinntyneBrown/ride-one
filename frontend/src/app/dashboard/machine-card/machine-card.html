@let v = view();
@let s = status();
<label class="machine-card" [class.machine-card--failed]="failed()" [attr.for]="id()">
  <input
    class="machine-card__input"
    type="radio"
    name="machine"
    [id]="id()"
    [value]="machine()"
    [checked]="checked()"
    [disabled]="disabled()"
    [attr.aria-invalid]="failed() ? 'true' : null"
    [attr.aria-describedby]="id() + '-desc'"
    (change)="pick.emit()"
  />
  <span class="machine-card__media">
    <img [src]="photo()" alt="" />
    @if (v.lastUsed) {
      <span class="machine-card__tag">Last used</span>
    }
  </span>
  <span class="machine-card__body">
    <span class="machine-card__kind">
      <span>{{ v.kind }}</span>
      @if (loading()) {
        <span class="skeleton skeleton--text" aria-hidden="true"></span>
      } @else {
        <wz-signal-bars [signal]="v.signal" />
      }
    </span>
    <span class="machine-card__name">{{ v.name }}</span>
    <span class="machine-card__serial">{{ v.advertisedName }}</span>
    <dl class="dl dl--split" [id]="id() + '-desc'">
      <div>
        <dt>Wattzup controls</dt>
        <dd>{{ v.controls }}</dd>
      </div>
      <div>
        <dt>Last session</dt>
        <dd>{{ v.lastSession }}</dd>
      </div>
    </dl>
    <span class="machine-card__foot">
      @if (loading()) {
        <span class="skeleton skeleton--text" aria-hidden="true"></span>
      } @else if (s.kind === 'not-found') {
        <p class="machine-card__error"><wz-icon name="warning" size="sm" />{{ s.text }}</p>
        <button
          class="machine-card__cta machine-card__cta--inverse"
          type="button"
          (click)="retry.emit()"
        >
          Try again
        </button>
      } @else if (s.kind === 'connecting') {
        <span class="machine-card__cta"
          ><span class="spinner spinner--sm" aria-hidden="true"></span>{{ s.text }}</span
        >
      } @else {
        <span class="machine-card__cta" [class.machine-card__cta--primary]="v.lastUsed">{{
          v.cta
        }}</span>
      }
    </span>
  </span>
</label>
