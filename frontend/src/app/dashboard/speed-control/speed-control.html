<div class="speed-control" role="group" [attr.aria-labelledby]="labelledBy()">
  <button
    class="step-btn"
    type="button"
    aria-label="Slower"
    [disabled]="lowerDisabled()"
    (click)="step.emit(-1)"
  >
    <wz-icon name="minus" size="lg" />
  </button>
  <div class="speed-control__readout speed-control__readout--hero">
    <span class="numeral" aria-live="polite">{{ valueText() }}</span><small>{{ noteText() }}</small>
  </div>
  <button
    class="step-btn"
    type="button"
    aria-label="Faster"
    [disabled]="raiseDisabled()"
    (click)="step.emit(1)"
  >
    <wz-icon name="plus" size="lg" />
  </button>
</div>
