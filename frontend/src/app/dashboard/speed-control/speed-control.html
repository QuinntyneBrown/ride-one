<div class="speed-control" role="group" aria-labelledby="speed-control-label">
  <button
    class="step-btn"
    type="button"
    aria-label="Lower speed"
    [disabled]="lowerDisabled()"
    (click)="step.emit(-1)"
  >
    <wz-icon name="minus" size="lg" />
  </button>
  <div class="speed-control__readout">
    <span class="speed-control__label" id="speed-control-label">Speed</span
    ><span class="numeral" aria-live="polite">{{ valueText() }}</span
    ><small>km/h</small>
  </div>
  <button
    class="step-btn"
    type="button"
    aria-label="Raise speed"
    [disabled]="raiseDisabled()"
    (click)="step.emit(1)"
  >
    <wz-icon name="plus" size="lg" />
  </button>
</div>
