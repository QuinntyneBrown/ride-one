<div class="form-summary" tabindex="-1" #box>
  <wz-alert tone="danger" icon="alert-circle" [heading]="title()">
    <ul class="form-summary__list">
      @for (l of links(); track l.fieldId) {
        <li>
          <a [href]="'#' + l.fieldId" (click)="go($event, l.fieldId)">{{ l.text }}</a>
        </li>
      }
    </ul>
  </wz-alert>
</div>
