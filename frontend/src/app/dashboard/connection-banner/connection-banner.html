@for (b of service.banners(); track b.id) {
  <wz-alert
    [banner]="true"
    [tone]="b.tone"
    [icon]="b.icon"
    [heading]="b.title"
    [text]="b.text"
    [actionLabel]="b.action?.label ?? null"
    [dismissable]="b.dismissable"
    (action)="act(b)"
    (dismiss)="service.dismiss(b.id)"
  />
}
