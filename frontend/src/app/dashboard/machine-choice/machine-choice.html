<fieldset
  class="machine-choice"
  [disabled]="locked()"
  [attr.aria-describedby]="help() !== null ? 'machine-help' : null"
>
  <legend class="machine-choice__legend">Machine</legend>
  <div class="machine-choice__options">
    @for (o of options; track o.value) {
      <label class="machine-choice__option"
        ><input
          type="radio"
          name="machine"
          [value]="o.value"
          [checked]="machine() === o.value"
          (change)="choose.emit(o.value)"
        /><wz-icon [name]="o.value" size="sm" />{{ o.label }}</label
      >
    }
  </div>
  @if (help(); as text) {
    <p class="machine-choice__help" id="machine-help">{{ text }}</p>
  }
</fieldset>
