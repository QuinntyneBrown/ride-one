@let f = fields();
@let err = errors();
<wz-dialog-shell
  dialogId="edit-set"
  [heading]="data.title"
  [description]="description"
  icon="sliders"
>
  <div class="edit-set">
    <div class="edit-set__grid">
      <wz-num-stepper
        fieldId="set-rounds"
        label="Rounds"
        [value]="f.rounds"
        [error]="err.rounds ?? null"
        (valueChange)="edit({ rounds: $event })"
        (step)="step('rounds', $event)"
        (submitted)="save()"
      />
      <wz-num-stepper
        fieldId="set-work"
        label="Work"
        [value]="f.work"
        [error]="err.work ?? null"
        (valueChange)="edit({ work: $event })"
        (step)="step('work', $event)"
        (submitted)="save()"
      />
      <wz-num-stepper
        fieldId="set-rest"
        label="Recover"
        [value]="f.rest"
        [error]="err.rest ?? null"
        (valueChange)="edit({ rest: $event })"
        (step)="step('rest', $event)"
        (submitted)="save()"
      />
    </div>
    <wz-level-slider
      fieldId="set-work-level"
      label="Work resistance"
      [level]="f.workLevel"
      (levelChange)="edit({ workLevel: $event })"
    />
    <wz-level-slider
      fieldId="set-rest-level"
      label="Recover resistance"
      tone="rest"
      [level]="f.restLevel"
      (levelChange)="edit({ restLevel: $event })"
    />
    <div class="edit-set__grid edit-set__grid--2">
      <wz-num-stepper
        fieldId="set-work-cadence"
        label="Work cadence"
        [value]="f.workCadence"
        [error]="err.workCadence ?? null"
        (valueChange)="edit({ workCadence: $event })"
        (step)="step('workCadence', $event)"
        (submitted)="save()"
      />
      <wz-num-stepper
        fieldId="set-rest-cadence"
        label="Recover cadence"
        [value]="f.restCadence"
        [error]="err.restCadence ?? null"
        (valueChange)="edit({ restCadence: $event })"
        (step)="step('restCadence', $event)"
        (submitted)="save()"
      />
    </div>
  </div>
  <div dialog-footer class="edit-set__actions">
    <button class="btn" type="button" (click)="ref.close()">Cancel</button>
    <button class="btn btn--volt" type="button" [disabled]="!saved()" (click)="save()">Save</button>
  </div>
</wz-dialog-shell>
